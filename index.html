<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadru</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --ground: #EFEFEA;
    --panel: #FFFFFF;
    --panel-2: #F7F7F3;
    --ink: #121212;
    --muted: #6A6A64;
    --line: #121212;
    --line-soft: #D6D6CF;
    --accent: #2B49FF;
    --accent-ink: #FFFFFF;
    --danger: #D3341C;
    --shadow: 4px 4px 0 var(--ink);
    --font-ui: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
    --font-mono: 'IBM Plex Mono', 'SF Mono', Menlo, monospace;
    --site-paper: #FFFFFF;
    --site-ink: #121212;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #161616;
      --panel: #1E1E1D;
      --panel-2: #262625;
      --ink: #F0F0EA;
      --muted: #9C9C94;
      --line: #F0F0EA;
      --line-soft: #3A3A38;
      --accent: #7C8CFF;
      --accent-ink: #0E0E0E;
      --danger: #FF6A4E;
      --shadow: 4px 4px 0 var(--ink);
    }
  }
  :root[data-theme="dark"] {
    --ground: #161616;
    --panel: #1E1E1D;
    --panel-2: #262625;
    --ink: #F0F0EA;
    --muted: #9C9C94;
    --line: #F0F0EA;
    --line-soft: #3A3A38;
    --accent: #7C8CFF;
    --accent-ink: #0E0E0E;
    --danger: #FF6A4E;
    --shadow: 4px 4px 0 var(--ink);
  }

  * { box-sizing: border-box; border-radius: 0 !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--font-ui); font-size: 14px; line-height: 1.45;
    overflow: hidden;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- App shell ---------- */
  .app {
    display: grid; height: 100vh;
    grid-template-rows: 52px 1fr;
    grid-template-columns: 264px 1fr 300px;
    grid-template-areas: "top top top" "left canvas right";
  }
  .topbar {
    grid-area: top; display: flex; align-items: center; gap: 16px;
    padding: 0 16px; background: var(--panel); border-bottom: 2px solid var(--line);
  }
  .brand { font-weight: 800; font-size: 18px; letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px; }
  .brand .mark { width: 18px; height: 18px; background: var(--accent); display: inline-block; }
  .site-name-input {
    background: transparent; border: 0; border-bottom: 2px solid transparent; padding: 4px 2px;
    font-weight: 600; font-size: 15px; min-width: 200px;
  }
  .site-name-input:hover, .site-name-input:focus { border-bottom-color: var(--line); outline: none; }
  .topbar .spacer { flex: 1; }
  .status { font-family: var(--font-mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }

  .btn {
    border: 2px solid var(--line); background: var(--panel); padding: 7px 14px;
    font-weight: 600; font-size: 13px; line-height: 1; display: inline-flex; align-items: center; gap: 8px;
    transition: transform 60ms ease, box-shadow 60ms ease;
  }
  .btn:hover { box-shadow: var(--shadow); transform: translate(-1px, -1px); }
  .btn:active { box-shadow: none; transform: translate(0, 0); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--line); }
  .btn.ghost { border-color: transparent; }
  .btn.ghost:hover { border-color: var(--line); box-shadow: none; transform: none; }
  .btn.small { padding: 5px 9px; font-size: 12px; }
  .btn.danger { color: var(--danger); }
  .btn:disabled { opacity: .4; pointer-events: none; }

  /* ---------- Sidebars ---------- */
  .side {
    background: var(--panel); overflow-y: auto; display: flex; flex-direction: column;
  }
  .side.left { grid-area: left; border-right: 2px solid var(--line); }
  .side.right { grid-area: right; border-left: 2px solid var(--line); }
  .section { padding: 14px 16px; border-bottom: 2px solid var(--line-soft); }
  .section:last-child { border-bottom: 0; }
  .section-head {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;
  }
  .label {
    font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); font-weight: 500;
  }

  .page-list { display: flex; flex-direction: column; gap: 4px; }
  .page-item {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 2px solid transparent;
    cursor: pointer; font-weight: 500;
  }
  .page-item:hover { border-color: var(--line-soft); }
  .page-item.active { border-color: var(--line); background: var(--panel-2); }
  .page-item .dot { width: 8px; height: 8px; background: var(--line-soft); flex: none; }
  .page-item.active .dot { background: var(--accent); }
  .page-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .page-item .count { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }

  .palette { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .pal {
    border: 2px solid var(--line); background: var(--panel); padding: 10px 8px 8px;
    display: flex; flex-direction: column; gap: 6px; align-items: flex-start; text-align: left;
    transition: transform 60ms ease, box-shadow 60ms ease;
  }
  .pal:hover { box-shadow: var(--shadow); transform: translate(-1px, -1px); }
  .pal:active { box-shadow: none; transform: none; }
  .pal .ico { width: 100%; height: 22px; display: block; }
  .pal .ico rect, .pal .ico line { stroke: var(--ink); fill: none; stroke-width: 2; }
  .pal .ico rect.fill { fill: var(--ink); }
  .pal .ico rect.acc { fill: var(--accent); stroke: none; }
  .pal span { font-size: 12px; font-weight: 600; }

  /* ---------- Canvas ---------- */
  .canvas-wrap { grid-area: canvas; overflow: auto; padding: 32px 28px 120px; }
  .canvas-head { max-width: 860px; margin: 0 auto 12px; display: flex; justify-content: space-between; align-items: baseline; }
  .canvas-head .label { color: var(--muted); }
  .canvas {
    max-width: 860px; margin: 0 auto; background: var(--site-paper); color: var(--site-ink);
    border: 2px solid var(--line); box-shadow: 8px 8px 0 var(--line); min-height: 520px;
  }
  .canvas-empty {
    padding: 80px 24px; text-align: center; color: #6A6A64; font-family: var(--font-mono); font-size: 13px;
  }
  .canvas-empty b { display: block; font-family: var(--font-ui); font-size: 20px; color: #121212; margin-bottom: 8px; }

  .blk { position: relative; cursor: pointer; outline: 2px solid transparent; outline-offset: -2px; }
  .blk:hover { outline-color: var(--line-soft); }
  .blk.selected { outline: 2px solid var(--accent); }
  .blk.drop-before::before, .blk.drop-after::after {
    content: ""; position: absolute; left: 0; right: 0; height: 4px; background: var(--accent); z-index: 2;
  }
  .blk.drop-before::before { top: -2px; }
  .blk.drop-after::after { bottom: -2px; }
  .blk.dragging { opacity: .4; }
  .blk-tools {
    position: absolute; top: 0; right: 0; transform: translateY(-100%); display: none; gap: 0;
    background: var(--accent); z-index: 3;
  }
  .blk.selected .blk-tools { display: flex; }
  .blk-tools button {
    border: 0; background: transparent; color: var(--accent-ink); padding: 5px 8px; font-family: var(--font-mono);
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
  }
  .blk-tools button:hover { background: rgba(0,0,0,.18); }
  .blk-tools .tag { padding: 5px 10px; border-right: 1px solid rgba(0,0,0,.25); color: var(--accent-ink); font-family: var(--font-mono); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }

  /* ---------- Inspector ---------- */
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  .field input[type=text], .field input[type=url], .field textarea, .field select {
    border: 2px solid var(--line); background: var(--panel); padding: 8px 10px; width: 100%;
  }
  .field textarea { min-height: 96px; resize: vertical; line-height: 1.45; }
  .field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--accent); }
  .field .hint { font-size: 12px; color: var(--muted); }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 2px solid var(--line); }
  .seg button { border: 0; border-right: 2px solid var(--line); background: var(--panel); padding: 7px 4px; font-size: 12px; font-weight: 600; }
  .seg button:last-child { border-right: 0; }
  .seg button.on { background: var(--ink); color: var(--panel); }
  .swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .sw { height: 30px; border: 2px solid var(--line); cursor: pointer; position: relative; }
  .sw.on::after { content: ""; position: absolute; inset: 5px; border: 2px solid #fff; mix-blend-mode: difference; }
  .color-row { display: flex; gap: 8px; align-items: center; }
  .color-row input[type=color] { width: 40px; height: 34px; border: 2px solid var(--line); padding: 0; background: var(--panel); }
  .inspector-empty { color: var(--muted); font-size: 13px; line-height: 1.5; }
  .kbd { font-family: var(--font-mono); font-size: 11px; border: 1px solid var(--line-soft); padding: 1px 5px; }
  .actions-row { display: flex; gap: 6px; flex-wrap: wrap; }

  /* ---------- Overlays ---------- */
  .overlay {
    position: fixed; inset: 0; background: var(--ground); z-index: 50; display: none; flex-direction: column;
  }
  .overlay.open { display: flex; }
  .overlay-bar {
    height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 16px;
    background: var(--panel); border-bottom: 2px solid var(--line); flex: none;
  }
  .overlay-body { flex: 1; overflow: auto; }
  #preview-frame { width: 100%; height: 100%; border: 0; background: #fff; display: block; }
  .export-body { padding: 24px; max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; height: 100%; }
  .export-body textarea {
    flex: 1; width: 100%; border: 2px solid var(--line); background: var(--panel); padding: 14px;
    font-family: var(--font-mono); font-size: 12px; line-height: 1.5; resize: none; white-space: pre; overflow: auto;
  }
  .export-note { font-size: 13px; color: var(--muted); max-width: 65ch; }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translate(-50%, 20px); opacity: 0;
    background: var(--ink); color: var(--panel); padding: 10px 16px; font-weight: 600; font-size: 13px;
    border: 2px solid var(--line); box-shadow: 4px 4px 0 var(--accent); z-index: 60; pointer-events: none;
    transition: transform 140ms ease, opacity 140ms ease;
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  @media (max-width: 1000px) {
    .app { grid-template-columns: 220px 1fr 260px; }
  }
  @media (max-width: 760px) {
    body { overflow: auto; }
    .app { height: auto; grid-template-rows: 52px auto auto auto; grid-template-columns: 1fr;
      grid-template-areas: "top" "left" "canvas" "right"; }
    .side.left, .side.right { border: 0; border-bottom: 2px solid var(--line); }
    .canvas-wrap { padding: 20px 12px 60px; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand"><span class="mark"></span>Cadru</div>
    <input class="site-name-input" id="site-name" type="text" aria-label="Numele site-ului" placeholder="Numele site-ului">
    <div class="spacer"></div>
    <span class="status" id="status">Salvat local</span>
    <button class="btn ghost" id="btn-undo" title="Anulează (Ctrl+Z)">Anulează</button>
    <button class="btn" id="btn-preview">Previzualizare</button>
    <button class="btn primary" id="btn-export">Export HTML</button>
  </header>

  <aside class="side left">
    <div class="section">
      <div class="section-head">
        <span class="label">Pagini</span>
        <button class="btn small" id="btn-add-page">+ Pagină</button>
      </div>
      <div class="page-list" id="page-list"></div>
    </div>
    <div class="section">
      <div class="section-head"><span class="label">Adaugă bloc</span></div>
      <div class="palette" id="palette"></div>
      <p class="inspector-empty" style="margin:12px 0 0">Blocul apare sub cel selectat sau la finalul paginii.</p>
    </div>
  </aside>

  <main class="canvas-wrap" id="canvas-wrap">
    <div class="canvas-head">
      <span class="label" id="canvas-title"></span>
      <span class="label" id="canvas-count"></span>
    </div>
    <div class="canvas" id="canvas"></div>
  </main>

  <aside class="side right" id="inspector"></aside>
</div>

<div class="overlay" id="preview-overlay">
  <div class="overlay-bar">
    <span class="label">Previzualizare</span>
    <span class="status" id="preview-url"></span>
    <div class="spacer" style="flex:1"></div>
    <button class="btn" id="btn-close-preview">Înapoi la editor</button>
  </div>
  <div class="overlay-body"><iframe id="preview-frame" title="Previzualizare site"></iframe></div>
</div>

<div class="overlay" id="export-overlay">
  <div class="overlay-bar">
    <span class="label">Export HTML</span>
    <div class="spacer" style="flex:1"></div>
    <button class="btn primary" id="btn-copy">Copiază codul</button>
    <button class="btn" id="btn-close-export">Închide</button>
  </div>
  <div class="overlay-body">
    <div class="export-body">
      <p class="export-note">Un singur fișier HTML cu toate paginile. Salvează-l ca <span class="kbd">index.html</span> și urcă-l pe orice hosting static (Netlify, GitHub Pages, Vercel). Navigarea între pagini merge fără server.</p>
      <textarea id="export-code" readonly spellcheck="false"></textarea>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  // ---------- Helpers ----------
  const $ = (s, el = document) => el.querySelector(s);
  const uid = () => Math.random().toString(36).slice(2, 9);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const slugify = (s) => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'pagina';
  const paras = (t) => String(t ?? '').split(/\n{2,}/).filter(Boolean).map(p => `<p>${esc(p).replace(/\n/g, '<br>')}</p>`).join('');
  const lines = (t) => String(t ?? '').split('\n').map(s => s.trim()).filter(Boolean);
  const safeHref = (u) => { u = String(u || '#').trim(); return /^(https?:|mailto:|tel:|#|\/)/i.test(u) ? u : '#'; };

  // ---------- Block definitions ----------
  const BLOCKS = {
    hero: {
      name: 'Hero', icon: '<svg class="ico" viewBox="0 0 80 22"><rect x="1" y="1" width="78" height="20"/><rect class="fill" x="8" y="6" width="40" height="4"/><rect class="acc" x="8" y="13" width="18" height="4"/></svg>',
      defaults: { title: 'Construim lucruri solide', subtitle: 'Un studio mic, cu rezultate mari. Fără zgomot, fără colțuri rotunjite.', button: 'Vezi proiectele', link: '#', align: 'left' },
      fields: [
        { key: 'title', label: 'Titlu', kind: 'text' },
        { key: 'subtitle', label: 'Subtitlu', kind: 'textarea' },
        { key: 'button', label: 'Text buton', kind: 'text', hint: 'Lasă gol ca să ascunzi butonul.' },
        { key: 'link', label: 'Link buton', kind: 'url' },
        { key: 'align', label: 'Aliniere', kind: 'seg', options: [['left', 'Stânga'], ['center', 'Centru']] },
      ],
      render: (b) => `<section class="hero ${b.align === 'center' ? 'center' : ''}"><h1>${esc(b.title)}</h1>${b.subtitle ? `<p>${esc(b.subtitle)}</p>` : ''}${b.button ? `<a class="button" href="${esc(safeHref(b.link))}">${esc(b.button)}</a>` : ''}</section>`,
    },
    heading: {
      name: 'Titlu', icon: '<svg class="ico" viewBox="0 0 80 22"><rect class="fill" x="1" y="5" width="56" height="12"/></svg>',
      defaults: { text: 'Un titlu de secțiune', level: 'h2' },
      fields: [
        { key: 'text', label: 'Text', kind: 'text' },
        { key: 'level', label: 'Mărime', kind: 'seg', options: [['h2', 'Mare'], ['h3', 'Mediu'], ['h4', 'Mic']] },
      ],
      render: (b) => { const l = ['h2', 'h3', 'h4'].includes(b.level) ? b.level : 'h2'; return `<section><${l}>${esc(b.text)}</${l}></section>`; },
    },
    text: {
      name: 'Text', icon: '<svg class="ico" viewBox="0 0 80 22"><line x1="1" y1="4" x2="79" y2="4"/><line x1="1" y1="11" x2="79" y2="11"/><line x1="1" y1="18" x2="52" y2="18"/></svg>',
      defaults: { text: 'Scrie aici textul paragrafului. Un rând gol între paragrafe creează un paragraf nou.' },
      fields: [{ key: 'text', label: 'Conținut', kind: 'textarea', hint: 'Rând gol = paragraf nou.' }],
      render: (b) => `<section class="prose">${paras(b.text)}</section>`,
    },
    image: {
      name: 'Imagine', icon: '<svg class="ico" viewBox="0 0 80 22"><rect x="1" y="1" width="78" height="20"/><line x1="1" y1="21" x2="30" y2="6"/><line x1="30" y1="6" x2="50" y2="16"/><line x1="50" y1="16" x2="79" y2="4"/></svg>',
      defaults: { src: '', alt: 'Descrierea imaginii', caption: '' },
      fields: [
        { key: 'src', label: 'Adresa imaginii (URL)', kind: 'url', hint: 'Lipește un link către o imagine .jpg / .png / .webp.' },
        { key: 'alt', label: 'Text alternativ', kind: 'text' },
        { key: 'caption', label: 'Legendă', kind: 'text' },
      ],
      render: (b) => `<section><figure>${b.src ? `<img src="${esc(safeHref(b.src))}" alt="${esc(b.alt)}">` : `<div class="img-placeholder">Imagine – adaugă un URL</div>`}${b.caption ? `<figcaption>${esc(b.caption)}</figcaption>` : ''}</figure></section>`,
    },
    columns: {
      name: 'Două coloane', icon: '<svg class="ico" viewBox="0 0 80 22"><rect x="1" y="1" width="37" height="20"/><rect x="42" y="1" width="37" height="20"/></svg>',
      defaults: { leftTitle: 'Ce facem', left: 'Site-uri, aplicații și identități vizuale care rezistă în timp.', rightTitle: 'Cum lucrăm', right: 'Direct, fără ședințe inutile. Livrăm săptămânal.' },
      fields: [
        { key: 'leftTitle', label: 'Titlu stânga', kind: 'text' },
        { key: 'left', label: 'Text stânga', kind: 'textarea' },
        { key: 'rightTitle', label: 'Titlu dreapta', kind: 'text' },
        { key: 'right', label: 'Text dreapta', kind: 'textarea' },
      ],
      render: (b) => `<section class="cols"><div>${b.leftTitle ? `<h3>${esc(b.leftTitle)}</h3>` : ''}${paras(b.left)}</div><div>${b.rightTitle ? `<h3>${esc(b.rightTitle)}</h3>` : ''}${paras(b.right)}</div></section>`,
    },
    list: {
      name: 'Listă', icon: '<svg class="ico" viewBox="0 0 80 22"><rect class="fill" x="1" y="2" width="5" height="5"/><line x1="11" y1="4.5" x2="70" y2="4.5"/><rect class="fill" x="1" y="9" width="5" height="5"/><line x1="11" y1="11.5" x2="60" y2="11.5"/><rect class="fill" x="1" y="16" width="5" height="5"/><line x1="11" y1="18.5" x2="66" y2="18.5"/></svg>',
      defaults: { title: 'Servicii', items: 'Design de produs\nDezvoltare web\nBranding' },
      fields: [
        { key: 'title', label: 'Titlu', kind: 'text' },
        { key: 'items', label: 'Elemente', kind: 'textarea', hint: 'Un element pe rând.' },
      ],
      render: (b) => `<section>${b.title ? `<h3>${esc(b.title)}</h3>` : ''}<ul class="list">${lines(b.items).map(i => `<li>${esc(i)}</li>`).join('')}</ul></section>`,
    },
    quote: {
      name: 'Citat', icon: '<svg class="ico" viewBox="0 0 80 22"><rect class="acc" x="1" y="1" width="4" height="20"/><line x1="12" y1="6" x2="70" y2="6"/><line x1="12" y1="13" x2="60" y2="13"/></svg>',
      defaults: { text: 'Au livrat exact ce am cerut, la timp, fără surprize.', author: 'Client mulțumit' },
      fields: [
        { key: 'text', label: 'Citat', kind: 'textarea' },
        { key: 'author', label: 'Autor', kind: 'text' },
      ],
      render: (b) => `<section><blockquote><p>${esc(b.text)}</p>${b.author ? `<cite>${esc(b.author)}</cite>` : ''}</blockquote></section>`,
    },
    button: {
      name: 'Buton', icon: '<svg class="ico" viewBox="0 0 80 22"><rect class="acc" x="18" y="3" width="44" height="16"/></svg>',
      defaults: { text: 'Contactează-ne', link: 'mailto:salut@exemplu.ro', style: 'solid' },
      fields: [
        { key: 'text', label: 'Text', kind: 'text' },
        { key: 'link', label: 'Link', kind: 'url', hint: 'Poate fi mailto:, tel: sau #slug-pagina.' },
        { key: 'style', label: 'Stil', kind: 'seg', options: [['solid', 'Plin'], ['outline', 'Contur']] },
      ],
      render: (b) => `<section><a class="button ${b.style === 'outline' ? 'outline' : ''}" href="${esc(safeHref(b.link))}">${esc(b.text)}</a></section>`,
    },
    divider: {
      name: 'Linie', icon: '<svg class="ico" viewBox="0 0 80 22"><line x1="1" y1="11" x2="79" y2="11"/></svg>',
      defaults: {}, fields: [],
      render: () => `<section><hr></section>`,
    },
    spacer: {
      name: 'Spațiu', icon: '<svg class="ico" viewBox="0 0 80 22"><line x1="1" y1="2" x2="79" y2="2"/><line x1="1" y1="20" x2="79" y2="20"/><line x1="40" y1="5" x2="40" y2="17"/></svg>',
      defaults: { size: 'm' }, fields: [{ key: 'size', label: 'Mărime', kind: 'seg', options: [['s', 'Mic'], ['m', 'Mediu'], ['l', 'Mare']] }],
      render: (b) => `<div class="spacer-${['s', 'm', 'l'].includes(b.size) ? b.size : 'm'}"></div>`,
    },
  };
  const BLOCK_ORDER = ['hero', 'heading', 'text', 'image', 'columns', 'list', 'quote', 'button', 'divider', 'spacer'];

  const ACCENTS = ['#2B49FF', '#121212', '#D3341C', '#0A7A3E', '#E0A400', '#7A1FA2'];
  const FONTS = { grotesk: "'Archivo', 'Helvetica Neue', Arial, sans-serif", mono: "'IBM Plex Mono', Menlo, monospace", serif: "Georgia, 'Times New Roman', serif" };

  // ---------- State ----------
  const STORE_KEY = 'cadru.site.v1';
  let state, history = [], selectedId = null, currentPage = 0;

  function freshState() {
    return {
      site: { name: 'Studioul meu', accent: '#2B49FF', font: 'grotesk', footer: '© 2026 Studioul meu' },
      pages: [
        { id: uid(), title: 'Acasă', blocks: [
          mk('hero'), mk('columns'), mk('quote'),
        ] },
        { id: uid(), title: 'Servicii', blocks: [
          mk('heading', { text: 'Ce oferim' }), mk('list'), mk('button'),
        ] },
        { id: uid(), title: 'Contact', blocks: [
          mk('heading', { text: 'Hai să vorbim' }), mk('text', { text: 'Scrie-ne și revenim în aceeași zi.' }), mk('button'),
        ] },
      ],
    };
  }
  function mk(type, over = {}) { return Object.assign({ id: uid(), type }, structuredClone(BLOCKS[type].defaults), over); }

  function load() {
    try { const raw = localStorage.getItem(STORE_KEY); if (raw) { const s = JSON.parse(raw); if (s && s.pages && s.pages.length) return s; } } catch (e) {}
    return freshState();
  }
  let saveTimer;
  function save() {
    clearTimeout(saveTimer);
    $('#status').textContent = 'Se salvează…';
    saveTimer = setTimeout(() => {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); $('#status').textContent = 'Salvat local'; }
      catch (e) { $('#status').textContent = 'Nu s-a putut salva'; }
    }, 250);
  }
  function snapshot() { history.push(JSON.stringify(state)); if (history.length > 60) history.shift(); $('#btn-undo').disabled = false; }
  function commit() { save(); render(); }
  function undo() {
    if (!history.length) return;
    state = JSON.parse(history.pop());
    $('#btn-undo').disabled = history.length === 0;
    if (currentPage >= state.pages.length) currentPage = state.pages.length - 1;
    if (!page().blocks.find(b => b.id === selectedId)) selectedId = null;
    save(); render(); toast('Anulat');
  }

  const page = () => state.pages[currentPage];
  const selected = () => page().blocks.find(b => b.id === selectedId) || null;

  // ---------- Site CSS (shared by canvas, preview, export) ----------
  function siteCSS(site) {
    const font = FONTS[site.font] || FONTS.grotesk;
    return `
      .site{font-family:${font};color:#121212;background:#fff;line-height:1.5;font-size:17px}
      .site *{box-sizing:border-box;border-radius:0}
      .site section{padding:28px 40px}
      .site h1,.site h2,.site h3,.site h4{margin:0 0 12px;line-height:1.1;letter-spacing:-0.02em;text-wrap:balance}
      .site h1{font-size:52px;font-weight:800}
      .site h2{font-size:34px;font-weight:800}
      .site h3{font-size:22px;font-weight:700}
      .site h4{font-size:18px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
      .site p{margin:0 0 12px;max-width:65ch}
      .site p:last-child{margin-bottom:0}
      .site .hero{padding:64px 40px;border-bottom:2px solid #121212}
      .site .hero p{font-size:20px;max-width:48ch;margin-bottom:24px}
      .site .hero.center{text-align:center}
      .site .hero.center p{margin-left:auto;margin-right:auto}
      .site .button{display:inline-block;padding:12px 22px;background:${site.accent};color:#fff;font-weight:700;text-decoration:none;border:2px solid #121212;box-shadow:4px 4px 0 #121212}
      .site .button.outline{background:transparent;color:#121212}
      .site .button:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 #121212}
      .site .cols{display:grid;grid-template-columns:1fr 1fr;gap:32px}
      .site .cols>div{border-left:4px solid ${site.accent};padding-left:18px}
      .site .list{list-style:none;padding:0;margin:0;max-width:65ch}
      .site .list li{padding:12px 0;border-top:2px solid #121212}
      .site .list li:last-child{border-bottom:2px solid #121212}
      .site blockquote{margin:0;padding:8px 0 8px 22px;border-left:8px solid ${site.accent};font-size:24px;font-weight:600;line-height:1.3;max-width:40ch}
      .site blockquote cite{display:block;margin-top:12px;font-size:14px;font-style:normal;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:#6A6A64}
      .site figure{margin:0}
      .site figure img{display:block;width:100%;border:2px solid #121212}
      .site figcaption{margin-top:8px;font-size:13px;color:#6A6A64}
      .site .img-placeholder{height:240px;border:2px dashed #121212;display:flex;align-items:center;justify-content:center;color:#6A6A64;font-size:14px;background:repeating-linear-gradient(45deg,#fff 0 12px,#F2F2EE 12px 24px)}
      .site hr{border:0;border-top:2px solid #121212;margin:0}
      .site .spacer-s{height:16px}.site .spacer-m{height:40px}.site .spacer-l{height:96px}
      .site nav{display:flex;align-items:center;gap:6px;padding:16px 40px;border-bottom:2px solid #121212;flex-wrap:wrap}
      .site nav .brand{font-weight:800;font-size:18px;margin-right:auto;letter-spacing:-0.02em;display:flex;align-items:center;gap:10px;text-decoration:none;color:#121212}
      .site nav .brand i{width:14px;height:14px;background:${site.accent};display:inline-block}
      .site nav a.link{padding:6px 10px;text-decoration:none;color:#121212;font-weight:600;border:2px solid transparent;font-size:14px}
      .site nav a.link.on,.site nav a.link:hover{border-color:#121212}
      .site footer{padding:24px 40px;border-top:2px solid #121212;font-size:13px;color:#6A6A64;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
      @media(max-width:640px){.site section,.site nav,.site footer{padding-left:20px;padding-right:20px}.site .hero{padding:40px 20px}.site h1{font-size:36px}.site h2{font-size:28px}.site .cols{grid-template-columns:1fr}}
    `;
  }
  function renderNav(site, pages, activeIdx, hrefFn) {
    return `<nav><a class="brand" href="${hrefFn(0)}"><i></i>${esc(site.name)}</a>${pages.map((p, i) => `<a class="link ${i === activeIdx ? 'on' : ''}" href="${hrefFn(i)}">${esc(p.title)}</a>`).join('')}</nav>`;
  }
  function renderBlocks(blocks) { return blocks.map(b => BLOCKS[b.type] ? BLOCKS[b.type].render(b) : '').join(''); }
  function renderFooter(site) { return `<footer><span>${esc(site.footer)}</span><span>Făcut cu Cadru</span></footer>`; }

  // ---------- Editor render ----------
  function render() { renderPages(); renderCanvas(); renderInspector(); $('#site-name').value = state.site.name; }

  function renderPages() {
    const list = $('#page-list'); list.innerHTML = '';
    state.pages.forEach((p, i) => {
      const el = document.createElement('div');
      el.className = 'page-item' + (i === currentPage ? ' active' : '');
      el.innerHTML = `<span class="dot"></span><span class="name">${esc(p.title)}</span><span class="count">${p.blocks.length}</span>`;
      el.title = 'Deschide pagina';
      el.onclick = () => { currentPage = i; selectedId = null; render(); };
      list.appendChild(el);
    });
  }

  function renderCanvas() {
    const p = page();
    $('#canvas-title').textContent = `${state.site.name} / ${p.title}`;
    $('#canvas-count').textContent = `${p.blocks.length} ${p.blocks.length === 1 ? 'bloc' : 'blocuri'}`;
    const c = $('#canvas');
    let styleEl = $('#site-style'); if (!styleEl) { styleEl = document.createElement('style'); styleEl.id = 'site-style'; document.head.appendChild(styleEl); }
    styleEl.textContent = siteCSS(state.site);
    c.innerHTML = `<div class="site">${renderNav(state.site, state.pages, currentPage, () => 'javascript:void(0)')}<div id="blocks"></div>${renderFooter(state.site)}</div>`;
    c.querySelectorAll('nav a').forEach((a, i) => { a.onclick = (e) => { e.preventDefault(); currentPage = Math.max(0, i - 1); selectedId = null; render(); }; });
    const host = $('#blocks');
    if (!p.blocks.length) {
      host.innerHTML = `<div class="canvas-empty"><b>Pagina e goală</b>Alege un bloc din stânga ca să începi.</div>`;
      return;
    }
    p.blocks.forEach((b, idx) => {
      const def = BLOCKS[b.type]; if (!def) return;
      const w = document.createElement('div');
      w.className = 'blk' + (b.id === selectedId ? ' selected' : ''); w.dataset.id = b.id; w.draggable = true;
      w.innerHTML = `<div class="blk-tools"><span class="tag">${esc(def.name)}</span>
        <button data-act="up" ${idx === 0 ? 'disabled' : ''} title="Mută sus">↑</button>
        <button data-act="down" ${idx === p.blocks.length - 1 ? 'disabled' : ''} title="Mută jos">↓</button>
        <button data-act="dup" title="Duplică">Dublează</button>
        <button data-act="del" title="Șterge">Șterge</button></div>` + def.render(b);
      w.onclick = (e) => {
        const act = e.target.closest('[data-act]');
        if (act) { e.stopPropagation(); doAction(act.dataset.act, b.id); return; }
        if (e.target.closest('a')) e.preventDefault();
        if (selectedId !== b.id) { selectedId = b.id; renderCanvas(); renderInspector(); }
      };
      w.ondragstart = (e) => { dragId = b.id; w.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', b.id); };
      w.ondragend = () => { dragId = null; clearDrop(); };
      w.ondragover = (e) => { if (!dragId || dragId === b.id) return; e.preventDefault(); const r = w.getBoundingClientRect(); const after = e.clientY > r.top + r.height / 2; clearDrop(); w.classList.add(after ? 'drop-after' : 'drop-before'); };
      w.ondrop = (e) => { e.preventDefault(); if (!dragId || dragId === b.id) return; const r = w.getBoundingClientRect(); const after = e.clientY > r.top + r.height / 2; moveBlock(dragId, b.id, after); };
      host.appendChild(w);
    });
  }
  let dragId = null;
  function clearDrop() { document.querySelectorAll('.blk.drop-before,.blk.drop-after').forEach(el => el.classList.remove('drop-before', 'drop-after')); }
  function moveBlock(id, targetId, after) {
    const bl = page().blocks; const from = bl.findIndex(b => b.id === id); if (from < 0) return;
    snapshot();
    const [item] = bl.splice(from, 1);
    let to = bl.findIndex(b => b.id === targetId); if (after) to += 1;
    bl.splice(to, 0, item); selectedId = id; commit();
  }

  function doAction(act, id) {
    const bl = page().blocks; const i = bl.findIndex(b => b.id === id); if (i < 0) return;
    snapshot();
    if (act === 'up' && i > 0) { [bl[i - 1], bl[i]] = [bl[i], bl[i - 1]]; }
    else if (act === 'down' && i < bl.length - 1) { [bl[i + 1], bl[i]] = [bl[i], bl[i + 1]]; }
    else if (act === 'dup') { const copy = structuredClone(bl[i]); copy.id = uid(); bl.splice(i + 1, 0, copy); selectedId = copy.id; }
    else if (act === 'del') { bl.splice(i, 1); selectedId = null; toast('Bloc șters'); }
    commit();
  }

  function addBlock(type) {
    snapshot();
    const bl = page().blocks; const b = mk(type);
    const i = bl.findIndex(x => x.id === selectedId);
    if (i >= 0) bl.splice(i + 1, 0, b); else bl.push(b);
    selectedId = b.id; commit();
    const el = document.querySelector(`.blk[data-id="${b.id}"]`); if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }

  // ---------- Inspector ----------
  function field(f, value, onChange) {
    const wrap = document.createElement('div'); wrap.className = 'field';
    const lab = document.createElement('span'); lab.className = 'label'; lab.textContent = f.label; wrap.appendChild(lab);
    if (f.kind === 'textarea') {
      const t = document.createElement('textarea'); t.value = value ?? ''; t.oninput = () => onChange(t.value); wrap.appendChild(t);
    } else if (f.kind === 'seg') {
      const s = document.createElement('div'); s.className = 'seg';
      f.options.forEach(([v, l]) => { const b = document.createElement('button'); b.textContent = l; b.className = value === v ? 'on' : ''; b.onclick = () => { onChange(v); s.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); }; s.appendChild(b); });
      wrap.appendChild(s);
    } else if (f.kind === 'select') {
      const s = document.createElement('select'); f.options.forEach(([v, l]) => { const o = document.createElement('option'); o.value = v; o.textContent = l; o.selected = v === value; s.appendChild(o); }); s.onchange = () => onChange(s.value); wrap.appendChild(s);
    } else {
      const i = document.createElement('input'); i.type = f.kind === 'url' ? 'url' : 'text'; i.value = value ?? ''; i.oninput = () => onChange(i.value); wrap.appendChild(i);
    }
    if (f.hint) { const h = document.createElement('span'); h.className = 'hint'; h.textContent = f.hint; wrap.appendChild(h); }
    return wrap;
  }
  function section(title, extra) {
    const s = document.createElement('div'); s.className = 'section';
    const h = document.createElement('div'); h.className = 'section-head'; h.innerHTML = `<span class="label">${esc(title)}</span>`; if (extra) h.appendChild(extra); s.appendChild(h);
    return s;
  }
  let editTimer = null;
  function editBlock(b, key, v) {
    if (!editTimer) { snapshot(); }
    clearTimeout(editTimer); editTimer = setTimeout(() => { editTimer = null; }, 800);
    b[key] = v; save(); renderCanvas();
  }
  function editSite(key, v) {
    if (!editTimer) { snapshot(); }
    clearTimeout(editTimer); editTimer = setTimeout(() => { editTimer = null; }, 800);
    state.site[key] = v; save(); renderCanvas(); if (key === 'name') { $('#site-name').value = v; }
  }

  function renderInspector() {
    const ins = $('#inspector'); ins.innerHTML = '';
    const b = selected();
    if (b) {
      const def = BLOCKS[b.type];
      const s = section('Bloc: ' + def.name);
      if (!def.fields.length) { const p = document.createElement('p'); p.className = 'inspector-empty'; p.textContent = 'Acest bloc nu are setări.'; s.appendChild(p); }
      def.fields.forEach(f => s.appendChild(field(f, b[f.key], v => editBlock(b, f.key, v))));
      ins.appendChild(s);
      const a = section('Acțiuni');
      const row = document.createElement('div'); row.className = 'actions-row';
      row.innerHTML = `<button class="btn small" data-act="up">↑ Sus</button><button class="btn small" data-act="down">↓ Jos</button><button class="btn small" data-act="dup">Dublează</button><button class="btn small danger" data-act="del">Șterge</button>`;
      row.querySelectorAll('button').forEach(x => x.onclick = () => doAction(x.dataset.act, b.id));
      a.appendChild(row);
      const hint = document.createElement('p'); hint.className = 'inspector-empty'; hint.style.marginTop = '12px';
      hint.innerHTML = `Trage blocul în canvas ca să-l reordonezi. <span class="kbd">Delete</span> îl șterge, <span class="kbd">Esc</span> deselectează.`;
      a.appendChild(hint); ins.appendChild(a);
      return;
    }

    // Page settings
    const p = page();
    const del = document.createElement('button'); del.className = 'btn small danger'; del.textContent = 'Șterge pagina'; del.disabled = state.pages.length <= 1;
    del.onclick = () => { if (!confirm(`Ștergi pagina „${p.title}” cu tot conținutul ei?`)) return; snapshot(); state.pages.splice(currentPage, 1); currentPage = Math.max(0, currentPage - 1); selectedId = null; commit(); toast('Pagină ștearsă'); };
    const ps = section('Pagina', del);
    ps.appendChild(field({ key: 'title', label: 'Nume pagină', kind: 'text', hint: 'Apare în meniu. Adresa: #' + slugify(p.title) }, p.title, v => { if (!editTimer) snapshot(); clearTimeout(editTimer); editTimer = setTimeout(() => { editTimer = null; }, 800); p.title = v || 'Pagină'; save(); renderPages(); renderCanvas(); ps.querySelector('.hint').textContent = 'Apare în meniu. Adresa: #' + slugify(p.title); }));
    const mv = document.createElement('div'); mv.className = 'actions-row';
    mv.innerHTML = `<button class="btn small" ${currentPage === 0 ? 'disabled' : ''}>← Mută înainte</button><button class="btn small" ${currentPage === state.pages.length - 1 ? 'disabled' : ''}>Mută după →</button>`;
    const [l, r] = mv.querySelectorAll('button');
    l.onclick = () => { snapshot(); const pg = state.pages; [pg[currentPage - 1], pg[currentPage]] = [pg[currentPage], pg[currentPage - 1]]; currentPage--; commit(); };
    r.onclick = () => { snapshot(); const pg = state.pages; [pg[currentPage + 1], pg[currentPage]] = [pg[currentPage], pg[currentPage + 1]]; currentPage++; commit(); };
    ps.appendChild(mv); ins.appendChild(ps);

    // Site settings
    const ss = section('Site');
    ss.appendChild(field({ key: 'name', label: 'Nume site', kind: 'text' }, state.site.name, v => editSite('name', v)));
    ss.appendChild(field({ key: 'footer', label: 'Text subsol', kind: 'text' }, state.site.footer, v => editSite('footer', v)));
    ss.appendChild(field({ key: 'font', label: 'Font', kind: 'seg', options: [['grotesk', 'Grotesc'], ['mono', 'Mono'], ['serif', 'Serif']] }, state.site.font, v => editSite('font', v)));
    const cf = document.createElement('div'); cf.className = 'field';
    cf.innerHTML = `<span class="label">Culoare accent</span>`;
    const sw = document.createElement('div'); sw.className = 'swatches';
    ACCENTS.forEach(c => { const d = document.createElement('button'); d.className = 'sw' + (state.site.accent.toLowerCase() === c.toLowerCase() ? ' on' : ''); d.style.background = c; d.title = c; d.setAttribute('aria-label', 'Accent ' + c); d.onclick = () => { editSite('accent', c); renderInspector(); }; sw.appendChild(d); });
    cf.appendChild(sw);
    const cr = document.createElement('div'); cr.className = 'color-row';
    const ci = document.createElement('input'); ci.type = 'color'; ci.value = state.site.accent; ci.setAttribute('aria-label', 'Culoare personalizată');
    ci.oninput = () => { editSite('accent', ci.value); sw.querySelectorAll('.sw').forEach(x => x.classList.toggle('on', x.title.toLowerCase() === ci.value.toLowerCase())); };
    const ct = document.createElement('span'); ct.className = 'hint'; ct.textContent = 'sau alege orice culoare';
    cr.append(ci, ct); cf.appendChild(cr); ss.appendChild(cf);
    ins.appendChild(ss);

    const reset = section('Date');
    const rb = document.createElement('button'); rb.className = 'btn small danger'; rb.textContent = 'Șterge tot și pornește de la zero';
    rb.onclick = () => { if (!confirm('Ștergi tot site-ul? Nu se poate anula.')) return; history = []; $('#btn-undo').disabled = true; state = freshState(); currentPage = 0; selectedId = null; commit(); toast('Site nou'); };
    reset.appendChild(rb);
    const note = document.createElement('p'); note.className = 'inspector-empty'; note.style.marginTop = '10px'; note.textContent = 'Totul se salvează automat în acest browser.';
    reset.appendChild(note); ins.appendChild(reset);
  }

  // ---------- Palette ----------
  function renderPalette() {
    const pal = $('#palette'); pal.innerHTML = '';
    BLOCK_ORDER.forEach(t => { const d = BLOCKS[t]; const b = document.createElement('button'); b.className = 'pal'; b.innerHTML = d.icon + `<span>${esc(d.name)}</span>`; b.onclick = () => addBlock(t); pal.appendChild(b); });
  }

  // ---------- Export / preview ----------
  function buildSiteHTML() {
    const site = state.site;
    const slugs = state.pages.map(p => slugify(p.title));
    const fontLink = site.font === 'serif' ? '' : `<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">`;
    const pagesHTML = state.pages.map((p, i) => `<div class="page" id="${slugs[i]}" ${i === 0 ? '' : 'hidden'}>${renderNav(site, state.pages, i, j => '#' + slugs[j])}<main>${renderBlocks(p.blocks)}</main>${renderFooter(site)}</div>`).join('\n');
    return `<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${esc(site.name)}</title>
${fontLink}
<style>
html,body{margin:0;padding:0}
${siteCSS(site).replace(/\n\s+/g, '\n')}
.page[hidden]{display:none}
</style>
</head>
<body class="site">
${pagesHTML}
<script>
(function(){
  var ids=${JSON.stringify(slugs)};
  function show(){
    var h=location.hash.replace('#','');
    var id=ids.indexOf(h)>=0?h:ids[0];
    ids.forEach(function(i){var el=document.getElementById(i);if(el){el.hidden=i!==id;}});
    window.scrollTo(0,0);
  }
  window.addEventListener('hashchange',show);show();
})();
<\/script>
</body>
</html>`;
  }

  function openPreview() {
    const html = buildSiteHTML();
    const frame = $('#preview-frame');
    frame.srcdoc = html.replace('<body class="site">', '<body class="site" onload="location.hash=\'#' + slugify(page().title) + '\'">');
    $('#preview-url').textContent = slugify(state.site.name) + '.ro/#' + slugify(page().title);
    $('#preview-overlay').classList.add('open');
  }
  function openExport() {
    $('#export-code').value = buildSiteHTML();
    $('#export-overlay').classList.add('open');
  }

  // ---------- Toast ----------
  let toastTimer;
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1600); }

  // ---------- Wire up ----------
  state = load();
  renderPalette(); render();
  $('#btn-undo').disabled = true;

  $('#site-name').oninput = (e) => { editSite('name', e.target.value); if (!selected()) { const f = $('#inspector input'); if (f) f.value = e.target.value; } };
  $('#btn-add-page').onclick = () => { snapshot(); const n = state.pages.length + 1; state.pages.push({ id: uid(), title: 'Pagină ' + n, blocks: [mk('heading', { text: 'Pagină nouă' }), mk('text')] }); currentPage = state.pages.length - 1; selectedId = null; commit(); const f = $('#inspector input'); if (f) { f.focus(); f.select(); } };
  $('#btn-undo').onclick = undo;
  $('#btn-preview').onclick = openPreview;
  $('#btn-close-preview').onclick = () => $('#preview-overlay').classList.remove('open');
  $('#btn-export').onclick = openExport;
  $('#btn-close-export').onclick = () => $('#export-overlay').classList.remove('open');
  $('#btn-copy').onclick = async () => {
    const ta = $('#export-code');
    try { await navigator.clipboard.writeText(ta.value); toast('Cod copiat'); }
    catch (e) { ta.focus(); ta.select(); try { document.execCommand('copy'); toast('Cod copiat'); } catch (e2) { toast('Selectează și copiază manual'); } }
  };
  $('#canvas-wrap').addEventListener('click', (e) => { if (e.target === e.currentTarget || e.target.id === 'canvas' || e.target.closest('.canvas-head')) { selectedId = null; renderCanvas(); renderInspector(); } });

  document.addEventListener('keydown', (e) => {
    const inField = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !inField) { e.preventDefault(); undo(); return; }
    if (e.key === 'Escape') {
      if ($('#preview-overlay').classList.contains('open')) { $('#preview-overlay').classList.remove('open'); return; }
      if ($('#export-overlay').classList.contains('open')) { $('#export-overlay').classList.remove('open'); return; }
      if (selectedId) { selectedId = null; renderCanvas(); renderInspector(); }
      return;
    }
    if ((e.key === 'Delete' || e.key === 'Backspace') && !inField && selectedId) { e.preventDefault(); doAction('del', selectedId); }
  });
})();
</script>
</body>
</html>
